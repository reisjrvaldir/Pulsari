    <!-- Google Analytics 4 — ⚠️ substitua G-XXXXXXXXXX pelo ID real de medição

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', 'G-XXXXXXXXXX')
    </script>

    <!-- Meta Pixel (Facebook/Instagram Ads) — ⚠️ substitua SEU_PIXEL_ID pelo ID
         real do pixel (Gerenciador de Eventos do Meta Business Suite) assim que
         ele existir. Sem um ID real, o script carrega mas não envia dados a
         lugar nenhum — nada quebra, mas nada é rastreado até essa troca. -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments)
        }
        if (!f._fbq) f._fbq = n
        n.push = n
        n.loaded = !0
        n.version = '2.0'
        n.queue = []
        t = b.createElement(e)
        t.async = !0
        t.src = v
        s = b.getElementsByTagName(e)[0]
        s.parentNode.insertBefore(t, s)
      })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js')
      fbq('init', 'SEU_PIXEL_ID')
      fbq('track', 'PageView')
    </script>
